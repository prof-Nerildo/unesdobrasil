<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>UNES - Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .error { color: red; font-size: 14px; text-align: center; margin-top: 10px; min-height: 20px; }
        .links { text-align: center; margin-top: 15px; font-size: 14px; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Acesso UNES</h2>
    <input type="text" id="login_input" placeholder="E-mail ou Usuário">
    <input type="password" id="senha_input" placeholder="Sua Senha">
    <button id="btnEntrar" onclick="fazerLogin()">ENTRAR</button>
    <div id="mensagem" class="error"></div>
    
    <div class="links">
        <a href="esqueci-senha.html">Esqueci minha senha</a>
    </div>
    <div class="links">
        <a href="cadastro-instituicao.html">Cadastre-se</a>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    async function fazerLogin() {
        const msg = document.getElementById('mensagem');
        const btn = document.getElementById('btnEntrar');
        const loginVal = document.getElementById('login_input').value;
        const senhaVal = document.getElementById('senha_input').value;

        if(!loginVal || !senhaVal) {
            msg.innerText = "Preencha todos os campos.";
            return;
        }

        // Feedback visual de carregamento
        msg.innerText = "Autenticando...";
        btn.disabled = true;

        try {
            const dados = { login: loginVal, senha: senhaVal };
            
            // Chama a API
            const res = await chamarApi('/account/login', 'POST', dados);

            console.log("Resposta da API:", res); // Debug no F12

            if (res && res.erro === false) {
                // SALVA O TOKEN
                if(res.token) {
                    localStorage.setItem('token_unes', res.token);
                    msg.style.color = "green";
                    msg.innerText = "Sucesso! Redirecionando...";
                    
                    // Pequeno delay para garantir que o LocalStorage gravou
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    msg.innerText = "Erro: Token não recebido.";
                    btn.disabled = false;
                }
            } else {
                msg.style.color = "red";
                msg.innerText = res.message || "Erro ao realizar login.";
                btn.disabled = false;
            }
        } catch (error) {
            console.error("Erro no processo de login:", error);
            msg.innerText = "Erro de conexão. Verifique o console (F12).";
            btn.disabled = false;
        }
    }

    // Atalho tecla Enter
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') fazerLogin();
    });
</script>
</body>
</html>
