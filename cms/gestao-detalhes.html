<div class="card">
    <h2>Gestão de Detalhes - <span id="nome-inst-titulo">...</span></h2>
    
    <form id="form-gestao">
        <input type="hidden" id="idInstituicao">

        <label>Edita Instituição de Ensino</label>
        <select id="pode_editar_instituicao">
            <option value="sim">sim</option>
            <option value="nao">nao</option>
        </select>

        <label>Edita Curso</label>
        <select id="pode_editar_curso">
            <option value="sim">sim</option>
            <option value="nao">nao</option>
        </select>

        <label>Documento Nacional (Valor)</label>
        <input type="number" step="0.01" id="valor_documento_nacional">

        <label>Frete (Valor)</label>
        <input type="number" step="0.01" id="valor_frete">

        <label>Possui Catraca?</label>
        <select id="tem_catraca">
            <option value="sim">sim</option>
            <option value="nao">nao</option>
        </select>

        <div id="campos-catraca">
            <label>Modelo Catraca</label>
            <input type="text" id="modelo_catraca">
            <label>Qtd.</label>
            <input type="number" id="qtd_catraca">
        </div>

        <button type="submit" style="background: green; color: white;">SALVAR ALTERAÇÕES E ATIVAR</button>
    </form>
</div>
