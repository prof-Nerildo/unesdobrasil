<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNES - Definir Nova Senha</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.3s; }
        button:hover { background: #218838; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #mensagem { margin-top: 20px; font-size: 14px; }
        .sucesso { color: #28a745; font-weight: bold; }
        .erro { color: #dc3545; }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Nova Senha</h2>
    <p>Crie uma nova senha de acesso para sua conta UNES.</p>
    
    <div id="form-area">
        <input type="password" id="novaSenha" placeholder="Digite a nova senha">
        <button id="btnSalvar" onclick="redefinirSenha()">SALVAR NOVA SENHA</button>
    </div>
    
    <div id="mensagem"></div>
</div>

<script>
    async function redefinirSenha() {
        const msgArea = document.getElementById('mensagem');
        const formArea = document.getElementById('form-area');
        const btn = document.getElementById('btnSalvar');
        
        // 1. Pega o Token da URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const novaSenha = document.getElementById('novaSenha').value;

        if (!novaSenha || novaSenha.length < 6) {
            msgArea.className = "erro";
            msgArea.innerText = "A senha deve ter no mínimo 6 caracteres.";
            return;
        }

        if (!token) {
            msgArea.className = "erro";
            msgArea.innerText = "Token inválido ou ausente!";
            return;
        }

        btn.disabled = true;
        msgArea.className = "";
        msgArea.innerText = "Processando...";

        try {
            // 2. Chama a API
            const response = await fetch('http://localhost/unesdobrasil/saas/index.php/api/account/change-password', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ novaSenha: novaSenha })
            });

            const textoResposta = await response.text();
            let dados;
            
            try {
                dados = JSON.parse(textoResposta);
            } catch (e) {
                throw new Error("Resposta do servidor inválida.");
            }

            if (dados.erro === false) {
                formArea.style.display = 'none';
                msgArea.className = "sucesso";
                msgArea.innerHTML = "Senha alterada com sucesso!<br><br><a href='login.html'>Voltar para o Login</a>";
            } else {
                msgArea.className = "erro";
                msgArea.innerText = dados.message;
                btn.disabled = false;
            }
        } catch (error) {
            msgArea.className = "erro";
            msgArea.innerText = "Erro ao conectar: " + error.message;
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
