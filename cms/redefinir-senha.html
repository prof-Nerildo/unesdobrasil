<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>UNES - Nova Senha</title>
</head>
<body>
    <h2>Definir Nova Senha</h2>
    <div id="form-area">
        <input type="password" id="novaSenha" placeholder="Digite a nova senha"><br><br>
        <button onclick="redefinirSenha()">Salvar Nova Senha</button>
    </div>
    <p id="mensagem"></p>

    <script>
        async function redefinirSenha() {
            // 1. Pega o Token da URL (ex: ?token=eyJ...)
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const novaSenha = document.getElementById('novaSenha').value;
            const btn = document.querySelector('button');

            if (!token) {
                alert("Token não encontrado na URL!");
                return;
            }

            btn.disabled = true;
            document.getElementById('mensagem').innerText = "Processando...";

            try {
                // 2. Chama a sua API que já está pronta
                const response = await fetch('http://localhost/unesdobrasil/saas/index.php/api/account/change-password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ novaSenha: novaSenha })
                });

                const dados = await response.json();

                if (dados.erro === false) {
                    document.getElementById('form-area').style.display = 'none';
                    document.getElementById('mensagem').innerHTML = "<b>Sucesso!</b> Senha alterada. <a href='http://localhost/unesdobrasil/cms/login.html'>Ir para Login</a>";
                } else {
                    document.getElementById('mensagem').innerText = "Erro: " + dados.message;
                    btn.disabled = false;
                }
            } catch (error) {
                document.getElementById('mensagem').innerText = "Erro ao conectar com a API.";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
