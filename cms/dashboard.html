<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>UNES - Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; display: flex; }
        .sidebar { width: 250px; height: 100vh; background: #343a40; color: white; padding: 20px; }
        .content { flex: 1; padding: 40px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 10px; cursor: pointer; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            background: white;
        }
        th, td { 
            padding: 15px; 
            border: 1px solid #eee; 
            text-align: left; 
        }
        th { 
            background-color: #f8f9fa; 
            color: #333; 
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }


    </style>
</head>
<body>

<div class="sidebar">
    <h2>UNES SaaS</h2>
    <p id="user-role">Carregando...</p>
    <hr>
    <button class="btn-logout" onclick="logout()">Sair</button>
</div>

<div class="content">
    <div class="card">
        <h1>Bem-vindo, <span id="user-name">...</span>!</h1>
        <p><strong>Instituição:</strong> <span id="inst-name">Nenhuma vinculada</span></p>
        <p><strong>Cargo:</strong> <span id="user-cargo">...</span></p>
    </div>

    <div class="card" style="margin-top: 20px;">
    <h3>Gestão de Instituições</h3>
    <table border="1" width="100%" style="border-collapse: collapse; text-align: left;">
        <thead>
            <tr style="background: #f4f4f4;">
                <th>Nome</th>
                <th>Dono</th>
                <th>Status</th>
                <th>Valor</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="lista-inst">
            </tbody>
    </table>
</div>


</div>
<script src="js/api.js"></script>
<script src="js/api.js"></script>
<script>
    async function carregarDashboard() {
        const res = await chamarApi('/account/me', 'GET'); 
        
        if (!res.erro && res.dados) {
            const u = res.dados; 
            
            document.getElementById('user-name').innerText = u.nome;
            document.getElementById('user-role').innerText = u.nivel_acesso;
            document.getElementById('user-cargo').innerText = u.cargo;
            document.getElementById('inst-name').innerText = u.instituicao || "Administrador Geral";

            // AGORA SIM: Se o perfil carregou, chamamos as instituições
            carregarInstituicoes();
        } else {
            console.error("Erro:", res.message);
            window.location.href = 'login.html'; 
        }
    }

    //async function carregarInstituicoes() {
    async function carregarInstituicoes() {
        const res = await chamarApi('/instituicao/todas', 'GET');
        const tabela = document.getElementById('lista-inst');
        
        if (!res.erro && res.dados) {
            tabela.innerHTML = res.dados.map(inst => `
                <tr>
                    <td>${inst.nome_fantasia || inst.razao_social}</td>
                    <td>${inst.dono_nome || 'Sistema'}</td>
                    <td>
                        <b style="color: ${inst.idStatus == 3 ? 'orange' : 'green'}">
                            ${inst.idStatus == 3 ? 'Pendente' : 'Ativo'}
                        </b>
                    </td>
                    <td>R$ ${inst.valor_documento_nacional || '0,00'}</td>
                    <td>
                        <button onclick="gerenciarInstituicao(${inst.idInstituicao}, '${inst.nome_fantasia}')">
                            ⚙️ Gerenciar
                        </button>
                    </td>
                </tr>
            `).join('');
        } else {
            tabela.innerHTML = `<tr><td colspan="5" style="text-align:center;">Nenhuma instituição encontrada.</td></tr>`;
        }
    }

    
    function gerenciarInstituicao(id) {
        // Redireciona para a página de edição levando o ID
        window.location.href = `gestao-detalhes.html?id=${id}`;
    }

    function logout() {
        localStorage.removeItem('token_unes');
        window.location.href = 'login.html';
    }

    // Inicia tudo
    carregarDashboard();
</script>
</body>
</html>
