<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>UNES - Cadastro Institucional</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; padding: 20px; color: #495057; }
        .container { max-width: 900px; margin: auto; }
        .card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* Título com a barrinha laranja igual ao seu Dashboard */
        .section-title {
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 30px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .section-title::before {
            content: "";
            width: 4px;
            height: 22px;
            background: #f39c12;
            margin-right: 12px;
            border-radius: 2px;
        }

        h2 { margin-top: 0; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 10px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: #6c757d; }
        input, select { 
            width: 100%; padding: 10px; border: 1px solid #dee2e6; border-radius: 6px; 
            box-sizing: border-box; font-size: 0.95rem; transition: 0.2s;
        }
        input:focus { border-color: #f39c12; outline: none; box-shadow: 0 0 0 0.2rem rgba(243, 156, 18, 0.1); }

        .btn-action { 
            width: 100%; padding: 15px; color: white; border: none; border-radius: 6px; 
            cursor: pointer; font-size: 1.1rem; font-weight: bold; margin-top: 30px; 
            transition: 0.2s;
        }
        .btn-next { background: #198754; } /* Verde para o Próximo */
        .btn-next:hover { background: #146c43; }
        
        .btn-finish { background: #0d6efd; } /* Azul para o Finalizar */
        .btn-finish:hover { background: #0a58ca; }

        .step { display: none; }
        .active { display: block; animation: fadeIn 0.4s; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg-erro { color: #dc3545; background: #f8d7da; padding: 12px; border-radius: 6px; margin-top: 20px; display: none; font-size: 0.9rem; border: 1px solid #f5c2c7; }
    </style>
</head>
<body>

<div class="container">
    <div id="passo1" class="step active">
        <div class="card">
            <h2>Novo Cadastro Institucional</h2>
            
            <div class="section-title">Dados Cadastrais</div>
            <div class="grid">
                <div class="full-width">
                    <label>Razão Social</label>
                    <input type="text" id="razao" placeholder="Razão Social completa">
                </div>
                <div>
                    <label>CNPJ</label>
                    <input type="text" id="cnpj" placeholder="00.000.000/0000-00">
                </div>
                <div class="full-width">
                    <label>Nome Fantasia</label>
                    <input type="text" id="fantasia" placeholder="Nome comercial">
                </div>
                <div>
                    <label>Insc. Estadual</label>
                    <input type="text" id="insc_est" placeholder="Inscrição Estadual">
                </div>
                <div>
                    <label>Insc. Municipal</label>
                    <input type="text" id="insc_mun" placeholder="Inscrição Municipal">
                </div>
            </div>

            <div class="section-title">Localização</div>
            <div class="grid-3">
                <div class="full-width">
                    <label>Endereço (Logradouro)</label>
                    <input type="text" id="rua" placeholder="Av, Rua, Travessa...">
                </div>
                <div>
                    <label>Nº</label>
                    <input type="text" id="num" placeholder="Ex: 123">
                </div>
                <div>
                    <label>Complemento</label>
                    <input type="text" id="comp" placeholder="Sala, Bloco...">
                </div>
                <div>
                    <label>CEP</label>
                    <input type="text" id="cep" placeholder="00000-000">
                </div>
                <div>
                    <label>Bairro</label>
                    <input type="text" id="bairro" placeholder="Bairro">
                </div>
                <div>
                    <label>Cidade</label>
                    <input type="text" id="cid" placeholder="Cidade">
                </div>
                <div>
                    <label>UF</label>
                    <select id="uf">
                        <option value="SP">SP</option>
                        <option value="RJ">RJ</option>
                        <option value="MG">MG</option>
                        <option value="PR">PR</option>
                        <option value="SC">SC</option>
                    </select>
                </div>
            </div>

            <div class="section-title">Contatos</div>
            <div class="grid">
                <div class="full-width">
                    <label>E-mail Institucional</label>
                    <input type="email" id="email_inst" placeholder="secretaria@instituicao.com">
                </div>
                <div>
                    <label>Telefone</label>
                    <input type="text" id="tel" placeholder="(00) 0000-0000">
                </div>
                <div>
                    <label>Telefone/Fax</label>
                    <input type="text" id="fax" placeholder="(00) 0000-0000">
                </div>
            </div>

            <button class="btn-action btn-next" onclick="salvarInstituicao()">PRÓXIMO PASSO</button>
            <div id="err1" class="msg-erro"></div>
        </div>
    </div>

    <div id="passo2" class="step">
        <div class="card">
            <h2>Dados do Administrador</h2>
            
            <div class="section-title">Informações Pessoais</div>
            <div class="grid">
                <div>
                    <label>Primeiro Nome</label>
                    <input type="text" id="p_nome" placeholder="Nome">
                </div>
                <div>
                    <label>Sobre Nome</label>
                    <input type="text" id="s_nome" placeholder="Sobrenome">
                </div>
                <div class="full-width">
                    <label>Cargo / Função</label>
                    <input type="text" id="cargo" placeholder="Ex: Diretor, TI, Coordenador">
                </div>
                <div class="full-width">
                    <label>E-mail Pessoal</label>
                    <input type="email" id="email_user" placeholder="nome@provedor.com">
                </div>
                <div>
                    <label>Telefone Residencial</label>
                    <input type="text" id="tel_res" placeholder="(00) 0000-0000">
                </div>
                <div>
                    <label>Celular | WhatsApp</label>
                    <input type="text" id="cel" placeholder="(00) 90000-0000">
                </div>
            </div>

            <div class="section-title">Acesso ao Sistema</div>
            <div class="grid">
                <div class="full-width">
                    <label>Usuário (Login)</label>
                    <input type="text" id="user" placeholder="Escolha um nome de usuário único">
                </div>
                <div>
                    <label>Senha</label>
                    <input type="password" id="pass" placeholder="********">
                </div>
                <div>
                    <label>Confirmar Senha</label>
                    <input type="password" id="pass_conf" placeholder="********">
                </div>
            </div>

            <button class="btn-action btn-finish" onclick="finalizarUsuario()">FINALIZAR CADASTRO</button>
            <div id="err2" class="msg-erro"></div>
        </div>
    </div>
</div>

<script src="js/env.php"></script>
<script src="js/api.js"></script>
<script>
    let idInstituicaoGerado = null;

    async function salvarInstituicao() {
        const divErro = document.getElementById('err1');
        divErro.style.display = 'none';

        const dadosInst = {
            razao_social:  document.getElementById('razao').value,
            nome_fantasia: document.getElementById('fantasia').value,
            cnpj:          document.getElementById('cnpj').value,
            insc_estadual: document.getElementById('insc_est').value,
            insc_municipal:document.getElementById('insc_mun').value,
            cep:           document.getElementById('cep').value,
            logradouro:    document.getElementById('rua').value,
            numero:        document.getElementById('num').value,
            complemento:   document.getElementById('comp').value,
            bairro:        document.getElementById('bairro').value,
            cidade:        document.getElementById('cid').value,
            uf:            document.getElementById('uf').value,
            email_contato: document.getElementById('email_inst').value,
            telefone:      document.getElementById('tel').value,
            fax:           document.getElementById('fax').value
        };

        const res = await chamarApi('/instituicao/registrar', 'POST', dadosInst);

        if (!res.erro && res.idInstituicao) {
            idInstituicaoGerado = res.idInstituicao;
            document.getElementById('passo1').classList.remove('active');
            document.getElementById('passo2').classList.add('active');
            window.scrollTo(0,0);
        } else {
            divErro.innerText = "Erro: " + (res.message || "Falha na comunicação.");
            divErro.style.display = 'block';
        }
    }

    async function finalizarUsuario() {
        const divErro = document.getElementById('err2');
        divErro.style.display = 'none';

        if(document.getElementById('pass').value !== document.getElementById('pass_conf').value) {
            alert("As senhas não conferem!"); 
            return;
        }

        const dadosUser = {
            primeiro_nome: document.getElementById('p_nome').value,
            sobrenome:     document.getElementById('s_nome').value,
            cargo:         document.getElementById('cargo').value,
            email:         document.getElementById('email_user').value,
            username:      document.getElementById('user').value,
            senha:         document.getElementById('pass').value,
            celular:       document.getElementById('cel').value,
            idInstituicao: idInstituicaoGerado
        };

        const res = await chamarApi('/account/register', 'POST', dadosUser);

        if (!res.erro) {
            localStorage.removeItem('token_unes');
            localStorage.removeItem('user_unes');
            alert("Cadastro realizado com sucesso!");
            window.location.replace('login.html');
        } else {
            divErro.innerText = "Erro: " + (res.message || "Falha no registro.");
            divErro.style.display = 'block';
        }
    }
</script>
</body>
</html>
