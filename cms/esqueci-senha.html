<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>UNES - Recuperar Senha</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .msg { font-size: 14px; text-align: center; margin-top: 15px; }
        .error { color: red; }
        .success { color: green; }
        .back { display: block; text-align: center; margin-top: 20px; font-size: 14px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>

<div class="card">
    <h2>Recuperar Acesso</h2>
    <p style="font-size: 14px; color: #666; text-align: center;">Informe seu e-mail ou nome de usuário para receber as instruções.</p>
    
    <input type="text" id="loginRecuperar" placeholder="E-mail ou Usuário">
    <button onclick="solicitarRecuperacao()">ENVIAR INSTRUÇÕES</button>
    
    <div id="mensagem" class="msg"></div>
    <a href="login.html" class="back">Voltar para o Login</a>
</div>

<script src="js/api.js"></script>
<script>
    async function solicitarRecuperacao() {
        const msg = document.getElementById('mensagem');
        const login = document.getElementById('loginRecuperar').value;

        if(!login) {
            msg.className = "msg error";
            msg.innerText = "Por favor, informe seu login.";
            return;
        }

        msg.className = "msg";
        msg.innerText = "Processando...";

        const res = await chamarApi('/account/forgot-password', 'POST', { login: login });

        if(!res.erro) {
            msg.className = "msg success";
            msg.innerText = res.message;
            // Se estiver em modo de debug (sem SMTP), mostra o token no console
            if(res.debug_token) {
                console.log("DEBUG: Link de recuperação -> ", `redefinir-senha.html?token=${res.debug_token}`);
                alert("Veja o link de recuperação no console (F12), pois o SMTP não enviou o e-mail.");
            }
        } else {
            msg.className = "msg error";
            msg.innerText = res.message;
        }
    }
</script>
</body>
</html>
